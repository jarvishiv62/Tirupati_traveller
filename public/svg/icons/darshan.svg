<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Temple shikhara (spire stack) -->
  <polygon points="32,6 36,16 28,16" fill="currentColor" opacity="0.7"/>
  <polygon points="32,13 37,22 27,22" fill="currentColor" opacity="0.5"/>
  <!-- Amalaka (crown disc) -->
  <ellipse cx="32" cy="6" rx="3" ry="1.5" fill="currentColor"/>
  <circle cx="32" cy="4.5" r="1.5" fill="currentColor"/>
  <!-- Temple body -->
  <rect x="18" y="22" width="28" height="22" rx="2" fill="currentColor" opacity="0.12" stroke="currentColor" stroke-width="2.5"/>
  <!-- Arch doorway -->
  <path d="M26 44 L26 33 Q32 27 38 33 L38 44" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="2"/>
  <!-- Temple steps -->
  <rect x="14" y="44" width="36" height="4" rx="1" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="2"/>
  <rect x="10" y="48" width="44" height="4" rx="1" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="2"/>
  <!-- Diya flame inside arch -->
  <ellipse cx="32" cy="43" rx="3" ry="1" fill="currentColor" opacity="0.5"/>
  <path d="M32 42 Q30 39 32 36.5 Q34 39 32 42Z" fill="currentColor"/>
  <!-- Side columns -->
  <rect x="18" y="30" width="4" height="14" rx="1" fill="currentColor" opacity="0.2"/>
  <rect x="42" y="30" width="4" height="14" rx="1" fill="currentColor" opacity="0.2"/>
  <!-- Decorative banner lines at top of body -->
  <line x1="18" y1="27" x2="46" y2="27" stroke="currentColor" stroke-width="1.5" opacity="0.5"/>
</svg>
