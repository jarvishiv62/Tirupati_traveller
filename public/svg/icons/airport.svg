<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Arch gate (airport terminal silhouette with temple arch) -->
  <path d="M10 48 L10 28 Q32 12 54 28 L54 48" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Runway / ground -->
  <line x1="6" y1="52" x2="58" y2="52" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Runway centre markings -->
  <line x1="26" y1="52" x2="30" y2="52" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="34" y1="52" x2="38" y2="52" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Airplane -->
  <path d="M32 36 L26 42 L28 43 L32 40 L36 43 L38 42 Z" fill="currentColor"/>
  <path d="M32 34 L30 38 L32 37 L34 38 Z" fill="currentColor" opacity="0.7"/>
  <!-- Tail -->
  <path d="M31 40 L30 44 L32 43 L34 44 L33 40" fill="currentColor" opacity="0.6"/>
  <!-- Decorative lotuses at arch base -->
  <path d="M10 48 Q14 44 18 48" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M46 48 Q50 44 54 48" stroke="currentColor" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Star / nav light -->
  <circle cx="32" cy="20" r="2" fill="currentColor" opacity="0.5"/>
  <line x1="32" y1="16" x2="32" y2="18" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <line x1="28" y1="20" x2="30" y2="20" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
  <line x1="34" y1="20" x2="36" y2="20" stroke="currentColor" stroke-width="1.5" opacity="0.4"/>
</svg>
