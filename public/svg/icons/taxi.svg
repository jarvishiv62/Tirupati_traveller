<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Roof arch (temple-inspired) -->
  <path d="M16 26 Q32 14 48 26" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Car body -->
  <rect x="8" y="26" width="48" height="20" rx="4" fill="currentColor" opacity="0.15"/>
  <rect x="8" y="26" width="48" height="20" rx="4" stroke="currentColor" stroke-width="2.5"/>
  <!-- Windows -->
  <rect x="15" y="29" width="13" height="9" rx="2" fill="currentColor" opacity="0.3"/>
  <rect x="31" y="29" width="13" height="9" rx="2" fill="currentColor" opacity="0.3"/>
  <!-- Divider line between windows -->
  <line x1="29" y1="29" x2="29" y2="38" stroke="currentColor" stroke-width="1.5"/>
  <!-- Wheels -->
  <circle cx="19" cy="46" r="6" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="19" cy="46" r="2.5" fill="currentColor"/>
  <circle cx="45" cy="46" r="6" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="45" cy="46" r="2.5" fill="currentColor"/>
  <!-- Taxi sign on roof -->
  <rect x="26" y="20" width="12" height="5" rx="2" fill="currentColor"/>
  <text x="32" y="24.5" text-anchor="middle" font-size="4" fill="white" font-weight="700" font-family="sans-serif">TAXI</text>
  <!-- Decorative dots (sacred motif) -->
  <circle cx="32" cy="10" r="1.5" fill="currentColor" opacity="0.5"/>
  <circle cx="27" cy="12" r="1" fill="currentColor" opacity="0.4"/>
  <circle cx="37" cy="12" r="1" fill="currentColor" opacity="0.4"/>
</svg>
