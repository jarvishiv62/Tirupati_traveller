<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Origin location pin -->
  <circle cx="5" cy="6" r="2.5"/>
  <circle cx="5" cy="6" r="0.8" fill="currentColor" stroke="none"/>
  <!-- Destination location pin -->
  <path d="M19 15 C19 18 16 21 16 21 C16 21 13 18 13 15 C13 13.343 14.343 12 16 12 C17.657 12 19 13.343 19 15Z"/>
  <circle cx="16" cy="15" r="1" fill="white" stroke="currentColor" stroke-width="1.2"/>
