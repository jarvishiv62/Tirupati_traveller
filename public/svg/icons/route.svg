  <path d="M5 8.5 C5 11 8 11 10 13 C12 15 13 15 13 15" stroke-dasharray="2 1.5"/>
  <!-- Small decorative temple/landmark along route -->
  <rect x="9" y="9.5" width="4" height="3" rx="0.3" stroke-width="1" opacity="0.5"/>
  <path d="M9 9.5 L11 7.5 L13 9.5" stroke-width="1" opacity="0.5"/>
  <!-- Distance marker dots -->
  <circle cx="7" cy="10" r="0.5" fill="currentColor" stroke="none" opacity="0.6"/>
