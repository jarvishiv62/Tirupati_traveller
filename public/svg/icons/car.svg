<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Car body lower -->
  <rect x="6" y="32" width="52" height="16" rx="4" fill="currentColor" opacity="0.13" stroke="currentColor" stroke-width="2.5"/>
  <!-- Car roof (smooth arch) -->
  <path d="M16 32 L20 20 Q32 14 44 20 L48 32 Z" fill="currentColor" opacity="0.18" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Windshield -->
  <path d="M22 32 L25 22 Q32 18 39 22 L42 32 Z" fill="currentColor" opacity="0.25"/>
  <!-- Left wheel — ornate with spokes -->
  <circle cx="18" cy="48" r="7" fill="currentColor" opacity="0.12" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="18" cy="48" r="3" fill="currentColor" opacity="0.3"/>
  <line x1="18" y1="41" x2="18" y2="55" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <line x1="11" y1="48" x2="25" y2="48" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <line x1="13" y1="43" x2="23" y2="53" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <line x1="23" y1="43" x2="13" y2="53" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <!-- Right wheel — ornate with spokes -->
  <circle cx="46" cy="48" r="7" fill="currentColor" opacity="0.12" stroke="currentColor" stroke-width="2.5"/>
  <circle cx="46" cy="48" r="3" fill="currentColor" opacity="0.3"/>
  <line x1="46" y1="41" x2="46" y2="55" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <line x1="39" y1="48" x2="53" y2="48" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <line x1="41" y1="43" x2="51" y2="53" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <line x1="51" y1="43" x2="41" y2="53" stroke="currentColor" stroke-width="1.2" opacity="0.5"/>
  <!-- Door line -->
  <line x1="32" y1="32" x2="32" y2="48" stroke="currentColor" stroke-width="1.5" opacity="0.35"/>
  <!-- Door handle left -->
  <rect x="24" y="38" width="5" height="2" rx="1" fill="currentColor" opacity="0.5"/>
  <!-- Door handle right -->
  <rect x="35" y="38" width="5" height="2" rx="1" fill="currentColor" opacity="0.5"/>
  <!-- Headlight -->
  <ellipse cx="8" cy="36" rx="2.5" ry="1.5" fill="currentColor" opacity="0.6"/>
  <!-- Tail light -->
  <ellipse cx="56" cy="36" rx="2.5" ry="1.5" fill="currentColor" opacity="0.6"/>
</svg>
