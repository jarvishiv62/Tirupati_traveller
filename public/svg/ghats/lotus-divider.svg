<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 520 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .lb-ln {
      stroke-dasharray: 230;
      stroke-dashoffset: 230;
      animation: lb-draw 4s ease-in-out infinite;
    }
    @keyframes lb-draw {
      0%   { stroke-dashoffset: 230; }
      35%  { stroke-dashoffset: 0;   }
      80%  { stroke-dashoffset: 0;   }
      100% { stroke-dashoffset: 230; opacity: 0; }
    }
    .lb-p { animation: lb-petal 4s ease-in-out infinite; opacity: 0; }
    .lb-p1{animation-delay:.6s}  .lb-p2{animation-delay:.75s}
    .lb-p3{animation-delay:.9s}  .lb-p4{animation-delay:1.05s}
    .lb-p5{animation-delay:1.2s} .lb-p6{animation-delay:1.35s}
    .lb-cd{ animation: lb-petal 4s ease-in-out 1.5s infinite; opacity:0; }
    @keyframes lb-petal {
      0%,12%  { opacity:0; }
      30%     { opacity:0.9; }
      72%     { opacity:0.9; }
      100%    { opacity:0; }
    }
    .lb-dot { animation: lb-dot-fade 4s ease-in-out infinite; opacity:0; }
    @keyframes lb-dot-fade { 0%,20%{opacity:0} 45%,75%{opacity:0.6} 100%{opacity:0} }
  </style>
  <line x1="260" y1="30" x2="30"  y2="30" stroke="#DE9619" stroke-width="0.9" class="lb-ln"/>
  <line x1="260" y1="30" x2="490" y2="30" stroke="#DE9619" stroke-width="0.9" class="lb-ln"/>
  <g class="lb-dot">
    <circle cx="100" cy="30" r="2.2" fill="#DE9619"/>
    <circle cx="160" cy="30" r="2.2" fill="#DE9619"/>
    <circle cx="360" cy="30" r="2.2" fill="#DE9619"/>
    <circle cx="420" cy="30" r="2.2" fill="#DE9619"/>
  </g>
  <g stroke="#DE9619" stroke-width="1.1" fill="#DE9619" fill-opacity="0.16">
    <path class="lb-p lb-p1" d="M260 30 C254 22 254 12 260 8  C266 12 266 22 260 30Z"/>
    <path class="lb-p lb-p2" d="M260 30 C254 22 254 12 260 8  C266 12 266 22 260 30Z" transform="rotate(60  260 30)"/>
    <path class="lb-p lb-p3" d="M260 30 C254 22 254 12 260 8  C266 12 266 22 260 30Z" transform="rotate(120 260 30)"/>
    <path class="lb-p lb-p4" d="M260 30 C254 22 254 12 260 8  C266 12 266 22 260 30Z" transform="rotate(180 260 30)"/>
    <path class="lb-p lb-p5" d="M260 30 C254 22 254 12 260 8  C266 12 266 22 260 30Z" transform="rotate(240 260 30)"/>
    <path class="lb-p lb-p6" d="M260 30 C254 22 254 12 260 8  C266 12 266 22 260 30Z" transform="rotate(300 260 30)"/>
  </g>
  <circle cx="260" cy="30" r="4" fill="#DE9619" class="lb-cd"/>
  <g stroke="#DE9619" stroke-width="1.2" opacity="0.4">
    <line x1="30"  y1="23" x2="30"  y2="37"/>
    <line x1="490" y1="23" x2="490" y2="37"/>
  </g>
</svg>